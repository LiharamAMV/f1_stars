<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostar - F1 Stars</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="site-header">
        <div class="header-container">
            <div class="site-branding">
                <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
                    <img src="img/logo.png" alt="F1 Stars Logo" class="site-logo">
                    <span class="site-title">f1stars<span>.click</span></span>
                </a>
            </div>
            <button class="nav-toggle" aria-label="Abrir menú">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 13h18c0.55 0 1-.45 1-1s-.45-1-1-1H3c-.55 0-1 .45-1 1s.45 1 1 1zm0-6h18c0.55 0 1-.45 1-1s-.45-1-1-1H3c-.55 0-1 .45-1 1s.45 1 1 1zm0 12h18c0.55 0 1-.45 1-1s-.45-1-1-1H3c-.55 0-1 .45-1 1s.45 1 1 1z"/>
                </svg>
            </button>
            <nav class="site-nav">
                <ul>
                    <li><a href="index.html">F1 Stars</a></li>
                    <li><a href="apostar.html" class="active">Apostar</a></li>
                    <li><a href="ver-apuestas.html">Ver apuestas</a></li>
                    <li><a href="calendario.html">Calendario</a></li>
                    <li><a href="ajustes.html">Ajustes</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <section class="f1-card">
            <h2>🎯 Enviar Apuesta</h2>

            <form id="f1-bet-form">
                <div class="form-group">
                    <label for="nick">Tu Nick:</label>
                    <select id="nick" name="nick" required>
                        <option value="">-- Selecciona tu nick --</option>
                        <option value="Andrés">Andrés</option>
                        <option value="Iván">Iván</option>
                        <option value="José Carlos">José Carlos</option>
                        <option value="Víctor">Víctor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="session">Selecciona la Sesión:</label>
                    <select id="session" name="session" required>
                        <option value="">-- Cargando sesiones pendientes... --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tu Podio Pronosticado (3 pilotos):</label>
                    <div class="drivers-selection">
                        <div class="f1-driver-select-wrap">
                            <select id="driver1" name="driver1" required>
                                <option value="">1º Posición</option>
                            </select>
                            <div class="f1-driver-preview" id="preview-driver1"></div>
                        </div>

                        <div class="f1-driver-select-wrap">
                            <select id="driver2" name="driver2" required>
                                <option value="">2º Posición</option>
                            </select>
                            <div class="f1-driver-preview" id="preview-driver2"></div>
                        </div>

                        <div class="f1-driver-select-wrap">
                            <select id="driver3" name="driver3" required>
                                <option value="">3º Posición</option>
                            </select>
                            <div class="f1-driver-preview" id="preview-driver3"></div>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 28px;">
                    <button type="submit" class="f1-btn">
                        Enviar Apuesta
                    </button>
                </div>

                <div id="bet-result" style="display:none;"></div>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>Todos los derechos &copy; 2026 f1stars.click | Porra F1 100% gratuita y sin cuotas</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
