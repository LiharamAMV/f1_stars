<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes y Gestión - F1 Stars</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Delete Confirmation Modal -->
    <div id="f1-confirm-modal" class="f1-modal-overlay">
        <div class="f1-modal-card">
            <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
            <h3 style="margin:0 0 10px;font-size:1.3rem;color:#dc2626;">¿Confirmar borrado?</h3>
            <p id="f1-confirm-msg" style="color:#475569;margin:0 0 20px;font-size:0.95rem;"></p>
            <p style="color:#94a3b8;font-size:0.85rem;margin:0 0 24px;">Esta acción <strong>no se puede deshacer</strong>.</p>
            <div style="display:flex;gap:12px;justify-content:center;">
                <button onclick="document.getElementById('f1-confirm-modal').style.display='none'" class="f1-btn f1-btn-secondary" style="padding:8px 20px;">Cancelar</button>
                <button id="f1-confirm-ok" class="f1-btn f1-btn-danger" style="padding:8px 20px;">Sí, borrar</button>
            </div>
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="site-header">
        <div class="header-container">
            <div class="site-branding">
                <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
                    <img src="img/logo.png" alt="F1 Stars Logo" class="site-logo">
                    <span class="site-title">f1stars<span>.click</span></span>
                </a>
            </div>
            <button class="nav-toggle" aria-label="Abrir menú">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 13h18c0.55 0 1-.45 1-1s-.45-1-1-1H3c-.55 0-1 .45-1 1s.45 1 1 1zm0-6h18c0.55 0 1-.45 1-1s-.45-1-1-1H3c-.55 0-1 .45-1 1s.45 1 1 1zm0 12h18c0.55 0 1-.45 1-1s-.45-1-1-1H3c-.55 0-1 .45-1 1s.45 1 1 1z"/>
                </svg>
            </button>
            <nav class="site-nav">
                <ul>
                    <li><a href="index.html">F1 Stars</a></li>
                    <li><a href="apostar.html">Apostar</a></li>
                    <li><a href="ver-apuestas.html">Ver apuestas</a></li>
                    <li><a href="calendario.html">Calendario</a></li>
                    <li><a href="ajustes.html" class="active">Ajustes</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <section class="f1-card">
            <h2>⚙️ Gestión de Apuestas y Configuración</h2>

            <!-- Filters -->
            <div class="f1-bets-filter-bar">
                <div class="f1-filter-field">
                    <label for="f1_filter_session">Filtrar por Sesión:</label>
                    <select id="f1_filter_session">
                        <option value="0">— Todas las sesiones —</option>
                    </select>
                </div>

                <div class="f1-filter-field">
                    <label for="f1_filter_nick">Filtrar por Participante:</label>
                    <select id="f1_filter_nick">
                        <option value="">— Todos los participantes —</option>
                        <option value="Andrés">Andrés</option>
                        <option value="Iván">Iván</option>
                        <option value="José Carlos">José Carlos</option>
                        <option value="Víctor">Víctor</option>
                    </select>
                </div>
            </div>

            <!-- Bets List Container -->
            <div id="f1-ajustes-container">
                <p style="text-align:center;padding:30px;color:#64748b;">⏳ Cargando apuestas para gestión...</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>Todos los derechos &copy; 2026 f1stars.click | Porra F1 100% gratuita y sin cuotas</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
